name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Read version
        id: version
        run: echo "version=$(deno task -q version)" >> "$GITHUB_OUTPUT"

      - name: Check and test
        run: |
          deno task check
          deno task test

      - name: Compile all targets
        run: |
          deno task compile:win
          deno task compile:linux
          deno task compile:mac-arm
          deno task compile:mac-x64

      - name: Build .deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG=deb/pc-health-broadcaster_${VERSION}_amd64
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/applications" "$PKG/usr/share/icons/hicolor/256x256/apps"
          cp assets/icon.png "$PKG/usr/share/icons/hicolor/256x256/apps/pc-health-broadcaster.png"
          cp dist/pc-health-broadcaster-linux-x64 "$PKG/usr/bin/pc-health-broadcaster"
          chmod 755 "$PKG/usr/bin/pc-health-broadcaster"
          cat > "$PKG/DEBIAN/control" <<CONTROL
          Package: pc-health-broadcaster
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Simone Marrocco
          Description: Judo in Cloud PC health broadcaster
           Broadcasts CPU, RAM, battery, wifi, network and disk telemetry of a
           competition PC on the local network and shows every PC in one page.
          CONTROL
          cat > "$PKG/usr/share/applications/pc-health-broadcaster.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=PC Health Broadcaster
          Comment=Judo in Cloud PC health broadcaster
          Exec=/usr/bin/pc-health-broadcaster
          Icon=pc-health-broadcaster
          Terminal=false
          Categories=Utility;System;
          DESKTOP
          dpkg-deb --build --root-owner-group "$PKG" dist/

      - name: Put the version in the file names
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          for f in pc-health-broadcaster-*; do
            mv "$f" "${f/pc-health-broadcaster-/pc-health-broadcaster-${VERSION}-}"
          done

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
